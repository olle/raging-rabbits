spring:
  application:
    name: raging-rabbits
  rabbitmq:
    host: ${SPRING_RABBITMQ_HOST:localhost}
    port: ${SPRING_RABBITMQ_PORT:5672}
    username: ${SPRING_RABBITMQ_USERNAME:guest}
    password: ${SPRING_RABBITMQ_PASSWORD:guest}
    # Fail fast with a clear error if the broker is down at startup.
    # (Set to false if you want the app to stay up and retry via the admin.)
    # connection-timeout: 5s

app:
  # Baseline: individual clients, each with 1 queue + topic/fanout bindings (see below).
  clients: ${CLIENTS:20000}
  # Bounded contexts (DDD), one topic exchange each (<context>.<topic-exchange-suffix>).
  # Baseline range is 5-7 exchanges.
  topic-contexts: ${TOPIC_CONTEXTS:orders,payments,shipping,notifications,billing,inventory}
  topic-exchange-suffix: ${TOPIC_EXCHANGE_SUFFIX:events}
  # Routing keys bound per client per context exchange (1-3, at most 3).
  topic-keys: ${TOPIC_KEYS:2}
  # Shared fanout exchanges, one binding per client queue each (same info for all clients).
  fanout-exchanges: ${FANOUT_EXCHANGES:broadcast.announcements,broadcast.alerts,broadcast.config}
  # Parallel declaration threads.
  concurrency: ${CONCURRENCY:8}
  queue-prefix: ${QUEUE_PREFIX:client.}
  # routing-key-prefix defaults to queue-prefix; override with ROUTING_KEY_PREFIX if needed
  routing-key-prefix: ${ROUTING_KEY_PREFIX:}
  durable: ${DURABLE:true}
  log-every: ${LOG_EVERY:1000}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
