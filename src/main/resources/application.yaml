spring:
  application:
    name: raging-rabbits
  rabbitmq:
    host: ${SPRING_RABBITMQ_HOST:localhost}
    port: ${SPRING_RABBITMQ_PORT:5672}
    username: ${SPRING_RABBITMQ_USERNAME:guest}
    password: ${SPRING_RABBITMQ_PASSWORD:guest}
    # Fail fast with a clear error if the broker is down at startup.
    # (Set to false if you want the app to stay up and retry via the admin.)
    # connection-timeout: 5s

app:
  # Baseline: individual clients, each with 1 queue + topic/fanout bindings (see below).
  clients: ${CLIENTS:20000}
  # Bounded contexts (DDD), one topic exchange each (<context>.<topic-suffix>).
  # Baseline range is 5-7 exchanges.
  topics: ${TOPICS:orders,payments,shipping,notifications,billing,inventory}
  topic-suffix: ${TOPIC_SUFFIX:events}
  # Routing keys bound per client per context exchange (1-3, at most 3).
  keys: ${KEYS:2}
  # Shared fanout exchanges, one binding per client queue each (same info for all clients).
  fanouts: ${FANOUTS:broadcast.announcements,broadcast.alerts,broadcast.config}
  # Parallel declaration threads.
  concurrency: ${CONCURRENCY:8}
  queue-prefix: ${QUEUE_PREFIX:client.}
  # routing-key-prefix defaults to queue-prefix; override with ROUTING_KEY_PREFIX if needed
  routing-key-prefix: ${ROUTING_KEY_PREFIX:}
  durable: ${DURABLE:true}
  # Messaging noise after provisioning: off|low (5/s)|medium (25/s)|high (100/s)|<msg/s>.
  noise: ${NOISE:off}
  # Per-message TTL for noise so it evaporates instead of filling queues without bound.
  noise-ttl-ms: ${NOISE_TTL_MS:30000}
  # Status overview: auto (TTY-aware)|console (force ANSI screen)|log (summary lines).
  monitor: ${MONITOR:auto}
  # Drain workers (virtual threads), each draining a shard of the client queues. Always on.
  consumers: ${CONSUMERS:1}
  drain-channels: ${DRAIN_CHANNELS:4}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
